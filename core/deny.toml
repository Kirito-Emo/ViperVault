[graph]
all-features = true

[advisories]
unmaintained = "workspace"

# These are configured with lint levels
yanked = "warn"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
# High confidence when inferring licenses from LICENSE text
confidence-threshold = 0.95

# Everything not explicitly allowed is denied by default
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
]

exceptions = []

clarify = []