[package]
name = "vipervault-core-fuzz"
version = "0.1.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
libfuzzer-sys = "0.4.12"
secrecy = "0.10.3"
uuid = "1.22.0"

[dependencies.vipervault-core]
path = "../crates/vipervault-core"

[[bin]]
name = "decode_vault_file"
path = "fuzz_targets/decode_vault_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_totp_otpauth_uri"
