[package]
name = "vipervault-core"
version = "0.1.0"
edition = "2024"
authors = ["Emanuele Relmi"]
description = "ViperVault core library (vault format, crypto, memory safety)"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Kirito-Emo/ViperVault"
readme = "../../../README.md"
keywords = ["password-manager", "security", "encryption", "privacy"]
categories = ["cryptography"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.21.0", features = ["serde", "v4"] }
thiserror = "2.0.18"
serde_json = "1.0.149"
zeroize = "1.8.2"
argon2 = "0.5.3"
rand = "0.9.2"
chacha20poly1305 = "0.10.1"
secrecy = { version = "0.10.3", features = ["serde"] }
tokio = { version = "1.49.0", features = ["rt", "macros", "sync", "time", "test-util"] }
fs2 = "0.4.3"
libc = "0.2.182"
tempfile = "3.26.0"